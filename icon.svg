<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient nền xanh dương nhạt phẳng hiện đại (Flat Design) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <!-- Đổ bóng nhẹ tinh tế -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Khung bo góc squircle chuẩn icon ứng dụng (Nền ngoài trong suốt) -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGradient)" stroke="#bae6fd" stroke-width="4" filter="url(#subtleShadow)" />

  <!-- Điểm xuyết vòng tròn thư pháp mờ nhẹ ở hậu cảnh -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="24 12 6 12" opacity="0.35" />

  <!-- Chữ Hán "中" (Trung) thư pháp chuẩn mực, màu đen đậm nét -->
  <text x="256" y="348" 
        font-family="'Noto Serif SC', 'KaiTi', 'STKaiti', 'SimSun', serif" 
        font-size="270" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#0f172a" 
        letter-spacing="0">中</text>
</svg>
